<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E2240" />
    <title>PayStay</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <style>
      /* Shown while the app's JavaScript is still downloading. React replaces it as soon as it starts. */
      #root:empty { display: none; }
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #F1F4F8; color: #0E2240; font-family: "DM Serif Display", Georgia, serif; }
      .boot-hotel { font-size: 56px; line-height: 1; animation: boot-bob 1.1s ease-in-out infinite; }
      .boot-shadow { width: 44px; height: 8px; border-radius: 50%; background: rgba(14,34,64,.18); margin-top: -8px; animation: boot-shadow 1.1s ease-in-out infinite; }
      .boot-name { font-size: 30px; letter-spacing: .01em; }
      .boot-dots { display: flex; gap: 6px; }
      .boot-dots i { width: 7px; height: 7px; border-radius: 50%; background: #D9701F; animation: boot-dot 1.2s ease-in-out infinite; }
      .boot-dots i:nth-child(2) { animation-delay: .2s; } .boot-dots i:nth-child(3) { animation-delay: .4s; }
      @keyframes boot-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @keyframes boot-shadow { 0%, 100% { transform: scaleX(1); opacity: .9; } 50% { transform: scaleX(.6); opacity: .5; } }
      @keyframes boot-dot { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .boot-hotel, .boot-shadow, .boot-dots i { animation: none; } }
    </style>
  </head>
  <body>
    <div class="boot" id="boot" aria-label="Loading PayStay" role="status">
      <div class="boot-hotel">🏨</div>
      <div class="boot-shadow"></div>
      <div class="boot-name">PayStay</div>
      <div class="boot-dots"><i></i><i></i><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
